<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="node_modules/@fontsource/inter/400.css">
<link rel="stylesheet" href="node_modules/@fontsource/inter/500.css">
<link rel="stylesheet" href="node_modules/@fontsource/inter/600.css">
<link rel="stylesheet" href="node_modules/@fontsource/inter/700.css">
<link rel="stylesheet" href="node_modules/@fontsource/inter/800.css">
<link rel="stylesheet" href="node_modules/@fontsource/fraunces/600.css">
<link rel="stylesheet" href="node_modules/@fontsource/fraunces/700.css">
<style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:transparent}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden}
#stage.solid{background:radial-gradient(1200px 1200px at 50% 38%,#15364d 0%,#0F2A3D 60%,#0b2232 100%)}
#stage.overlay{background:linear-gradient(180deg,rgba(11,29,43,.82) 0%,rgba(11,29,43,.25) 30%,rgba(11,29,43,.15) 55%,rgba(11,29,43,.85) 78%,rgba(11,29,43,.9) 100%)}
.abs{position:absolute}
#tag{left:80px;top:300px;font:600 30px Inter;letter-spacing:8px;color:#E2765A}
#tagline{left:80px;top:350px;width:90px;height:4px;background:#E2765A;border-radius:2px}
.scene{position:absolute;inset:0;display:none}
.serif{font-family:Fraunces,serif}
.fitw{white-space:nowrap}
.row>div:first-child{flex:1;min-width:0}
.badge{left:80px;top:380px;width:120px;height:120px;border-radius:60px;background:#E2765A;color:#0F2A3D;font:700 68px Fraunces;display:flex;align-items:center;justify-content:center}
.head{left:80px;width:860px;color:#F6EFE3;font:600 84px/1.06 Fraunces}
.pill{border-radius:40px;padding:18px 34px;font:600 36px Inter;display:inline-flex;align-items:center;gap:14px;box-sizing:border-box;max-width:920px}
.pill svg{flex:none}
.p-light{background:#F6EFE3;color:#0F2A3D}.p-teal{background:#1F7A8C;color:#F6EFE3}.p-coral{background:#E2765A;color:#0F2A3D}
.note{color:#CFE6E9;font:500 38px Inter;text-align:center}
.lvl{border-radius:30px;padding:12px 26px;font:700 32px Inter;display:inline-flex;align-items:center;gap:12px}
.lvl i{width:16px;height:16px;border-radius:8px;background:currentColor;display:inline-block}
.row{left:90px;width:900px;height:160px;border-radius:28px;background:rgba(246,239,227,.08);border:2px solid rgba(207,230,233,.25);box-sizing:border-box;padding:0 34px;display:flex;align-items:center;justify-content:space-between}
.row .n{color:#F6EFE3;font:600 54px Fraunces}.row .t{color:#CFE6E9;font:500 30px Inter;margin-top:6px}
#cap{left:40px;top:1290px;width:1000px;text-align:center;font:900 92px/1.1 Inter;text-transform:uppercase;white-space:nowrap;color:#fff;text-shadow:0 6px 0 rgba(0,0,0,.4),0 8px 20px rgba(0,0,0,.45);-webkit-text-stroke:7px #050A19;paint-order:stroke fill}
#cap span{display:inline-block;margin:0 14px}
#cap .on{color:var(--acc,#FF7A59)}#cap .off{opacity:1}
#flash{left:0;top:0;width:1080px;height:1920px;background:#fff;opacity:0;pointer-events:none}
#brand{left:64px;top:160px;width:900px;display:none;pointer-events:none;font-family:Inter,sans-serif}
#brand .n{font:900 58px/1 Inter;color:#fff;letter-spacing:0;text-shadow:0 4px 0 rgba(0,0,0,.35),0 6px 16px rgba(0,0,0,.5);-webkit-text-stroke:3px rgba(5,10,25,.6);paint-order:stroke fill;white-space:nowrap}
#brand .n b{color:var(--acc)}
#brand .u{font:600 34px/1 Inter;color:rgba(225,232,248,.9);margin-top:12px;text-shadow:0 3px 8px rgba(0,0,0,.7)}
#foot{left:0;width:1080px;top:1690px;display:none;justify-content:center;pointer-events:none}
#foot span{background:var(--acc);color:#fff;font:900 48px/1 Inter;padding:32px 64px;border-radius:56px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#prog{left:0;top:0;height:10px;background:linear-gradient(90deg,#E2765A,#FFD166);width:0}
</style></head><body>
<div id="stage" class="solid">
 <svg id="rings" class="abs" width="1080" height="1920" style="left:0;top:0"></svg>
 <div id="tag" class="abs"></div><div id="tagline" class="abs"></div>
 <div id="scenes"></div>
 <div id="brand" class="abs"></div><div id="foot" class="abs"></div>
 <div id="cap" class="abs"></div>
 <div id="flash" class="abs"></div><div id="prog" class="abs"></div>
 <div id="cover" class="abs" style="left:0;top:0;width:1080px;height:1920px;display:none"></div>
</div>
<script>
// ---------- icons (24x24 line icons) ----------
const P={
 taxi:'<path d="M5 11l1.5-4.5A2 2 0 0 1 8.4 5h7.2a2 2 0 0 1 1.9 1.5L19 11"/><rect x="3" y="11" width="18" height="6" rx="2"/><circle cx="7.5" cy="17.5" r="1.5"/><circle cx="16.5" cy="17.5" r="1.5"/><path d="M10 3h4"/>',
 plane:'<path d="M2 16l20-6-2-3-6 2-6-6-2 1 4 7-5 1.5-2-2-2 .5z"/><path d="M3 21h18"/>',
 hotel:'<path d="M4 21V4h16v17"/><path d="M9 21v-4h6v4M8 8h2M14 8h2M8 12h2M14 12h2"/>',
 phone:'<path d="M5 3h4l2 5-3 2a12 12 0 0 0 6 6l2-3 5 2v4a2 2 0 0 1-2 2A18 18 0 0 1 3 5a2 2 0 0 1 2-2z"/>',
 passport:'<rect x="4" y="2.5" width="16" height="19" rx="2"/><circle cx="12" cy="10" r="3.5"/><path d="M8 17h8"/>',
 shield:'<path d="M12 2.5l8 3v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10v-6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/>',
 map:'<path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/>',
 pin:'<path d="M12 22s7-6.5 7-12a7 7 0 0 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/>',
 check:'<path d="M5 12l5 5L20 7"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/>',
 train:'<rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 11h14M9 21l-2-4M15 21l2-4"/><circle cx="9" cy="14" r="1"/><circle cx="15" cy="14" r="1"/>',
 storm:'<path d="M7 16a5 5 0 1 1 1-9.9A6 6 0 0 1 19 9a4 4 0 0 1-1 7.9"/><path d="M13 12l-3 5h4l-3 5"/>',
 sun:'<circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
 wave:'<path d="M2 15c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2M2 20c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2"/><path d="M8 9c0-3 3-5 6-5 2 0 3.5 1 4 2-2 0-3 1-3 3"/>',
 fire:'<path d="M12 22c4 0 7-3 7-7 0-4-3-6-4-10-2 2-3 4-3 6-1-1-2-2-2-4-2 2-5 5-5 8 0 4 3 7 7 7z"/>',
 alert:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/>',
 money:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M6 9v.01M18 15v.01"/>',
 bag:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
 nowifi:'<path d="M2 8.5a15 15 0 0 1 20 0M5.5 12.5a10 10 0 0 1 13 0M9 16.3a5 5 0 0 1 6 0"/><path d="M3 3l18 18"/>',
 pharmacy:'<path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z"/>',
 globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
 people:'<circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6M15 14.5c3 0 6 2 6 5"/>',
 lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
 camera:'<rect x="3" y="7" width="18" height="13" rx="2"/><circle cx="12" cy="13.5" r="3.5"/><path d="M8 7l1.5-3h5L16 7"/>',
 card:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/>',
 food:'<path d="M7 3v8a2 2 0 0 0 2 2v8M11 3v8M7 7h4M17 3c-2 2-2 6 0 8v10"/>',
 water:'<path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z"/>',
 health:'<path d="M12 21s-8-5-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 6-8 11-8 11z"/><path d="M9 11h6M12 8v6"/>',
 info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5h.01"/>',
 bus:'<rect x="4" y="3" width="16" height="15" rx="3"/><path d="M4 11h16M8 21v-3M16 21v-3"/><circle cx="8" cy="14.5" r="1"/><circle cx="16" cy="14.5" r="1"/>',
 compass:'<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>',
};
const icon=(name,size,color,sw=1.9)=>`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${P[name]||P.info}</svg>`;
const LEVELS={avoid:['Avoid Travel','#E05A47','#2a0f0b'],reconsider:['Reconsider Travel','#E2765A','#2a120b'],take_care:['Take Care','#F0A04B','#2a1a06'],be_aware:['Be Aware','#E9C46A','#2a2206'],clear:['Clear','#2A9D8F','#06201d']};
const lvlChip=k=>{const L=LEVELS[k]||LEVELS.be_aware;return `<span class="lvl" style="background:${L[1]};color:${L[2]}"><i></i>${L[0]}</span>`;};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------- timing helpers ----------
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>1-Math.pow(1-clamp(x),3);
let SPEC=null;
const norm=s=>String(s).replace(/[^\w']/g,'').toLowerCase();
function wt(sc,word,fallback){if(!word)return fallback;const w=sc.words.find(x=>norm(x[0])===norm(word));return w?Math.max(0,w[1]-.1):fallback;}

// ---------- scene builders: each returns html; animated nodes carry data-in / data-fx ----------
function pills(sc,list,top){let h='',y=top;(list||[]).forEach((p,i)=>{const at=wt(sc,p.at,1.2+i*1.1);
  if(p.style==='note'){h+=`<div class="abs note" data-in="${at}" data-fx="up" style="left:60px;width:960px;top:${y}px">${esc(p.text)}</div>`;y+=90;}
  else{const cls=p.style==='teal'?'p-teal':p.style==='coral'?'p-coral':'p-light';const ic=p.icon?icon(p.icon,40,cls==='p-teal'?'#F6EFE3':cls==='p-coral'?'#0F2A3D':'#1F7A8C',2.2):'';
   h+=`<div class="abs" style="left:0;width:1080px;top:${y}px;display:flex;justify-content:center"><div class="pill ${cls}" data-in="${at}" data-fx="pop">${ic}<span class="fit">${esc(p.text)}</span></div></div>`;y+=120;}});return h;}
// Store row: Google Play + App Store. SPEC.cta: soon = neither live, play = Google Play live; SPEC.ios = App Store live too.
const PLAY_SVG='<svg width="40" height="40" viewBox="0 0 24 24"><path d="M5 3.5v17l14-8.5z" fill="#1F7A8C"/></svg>';
const STORE_SVG='<svg width="40" height="40" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5" fill="#1F7A8C"/><path d="M9.6 6.5 15.8 17M14.4 6.5 8.2 17M6.5 14h11" stroke="#fff" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>';
function stores(at,top){const soon=SPEC.cta==='soon',ios=!!SPEC.ios;
 const label=soon?'Coming soon to':(ios?'Free on':'Free on Google Play · App Store coming soon');
 const pill=(svg,t,dim)=>`<div class="pill p-light" data-in="${at}" data-fx="pop" style="font-size:40px${dim?';opacity:.7':''}">${svg}${t}</div>`;
 return `<div class="abs" data-in="${at}" data-fx="up" style="left:0;width:1080px;top:${top}px;text-align:center;color:#CFE6E9;font:600 38px Inter">${label}</div>
  <div class="abs" style="left:0;width:1080px;top:${top+64}px;display:flex;justify-content:center;gap:28px">${pill(PLAY_SVG,'Google Play')}${pill(STORE_SVG,'App Store',!soon&&!ios)}</div>`;}
const B={
 hook(sc){let h='';
  if(sc.big) h+=`<div class="abs serif fitw" data-in="0" data-fx="pop" style="left:80px;width:860px;top:420px;color:#E2765A;font:700 400px/1 Fraunces" data-min="90">${esc(sc.big)}</div>`;
  else if(sc.icon) h+=`<div class="abs" data-in="0" data-fx="pop" style="left:80px;top:470px">${icon(sc.icon,320,'#F6EFE3',1.6)}</div>`;
  const V=(SPEC&&SPEC.variant)||0, hy=V===1?420:V===2?700:860; // layout variants so the profile grid never looks identical
  if(V===1&&(sc.big||sc.icon)) h=h.replace(/top:(420|470)px/,'top:900px');
  h+=`<div class="abs head fith" data-in=".25" data-fx="up" style="top:${hy}px;font-size:${V?108:96}px;max-height:${V?330:250}px;${sc._clip?'text-shadow:0 8px 30px rgba(0,0,0,.7);':''}${V===2?'text-align:center;left:60px;width:960px;':''}">${esc(sc.headline)}</div>`;
  if(sc.pill) h+=`<div class="abs pill p-coral" data-in="${wt(sc,sc.pill.at,1.0)}" data-fx="up" style="left:${V===2?190:80}px;top:${V===1?hy+360:V===2?1060:1140}px">${sc.pill.icon?icon(sc.pill.icon,40,'#0F2A3D',2.2):''}${esc(sc.pill.text)}</div>`;
  return h;},
 point(sc){let h='';const hasN=sc.n!=null&&sc.n!=='';
  if(hasN) h+=`<div class="abs badge" data-in="0" data-fx="pop">${esc(sc.n)}</div>`;
  h+=`<div class="abs head fith" data-in="0" data-fx="up" style="top:395px;${hasN?'left:230px;width:720px;':''}font-size:64px;max-height:150px">${esc(sc.headline)}</div>`;
  if(sc.icon) h+=`<div class="abs" data-in=".15" data-fx="pop" style="left:390px;top:590px">${icon(sc.icon,300,'#CFE6E9',1.5)}</div>`;
  return h+pills(sc,sc.pills,sc.icon?950:620);},
 number(sc){return `<div class="abs fitw" data-min="24" data-in="0" data-fx="up" style="left:80px;width:860px;top:470px;text-align:center;color:#CFE6E9;font:600 40px Inter;letter-spacing:5px">${esc(sc.label||'')}</div>
  <div class="abs serif fitw" data-min="90" data-in="${wt(sc,sc.at,.2)}" data-fx="pop" style="left:80px;width:860px;top:540px;text-align:center;color:#E2765A;font:700 260px/1 Fraunces">${esc(sc.value)}</div>`+pills(sc,sc.pills,880);},
 place(sc){return `<div class="abs serif fith" data-in="0" data-fx="up" style="left:80px;width:860px;top:470px;color:#F6EFE3;font:600 120px/1.05 Fraunces;max-height:260px">${esc(sc.name)}</div>
  <div class="abs" data-in=".2" data-fx="up" style="left:84px;top:${sc.country?650:600}px;color:#CFE6E9;font:500 40px Inter">${esc(sc.country||'')}</div>
  ${sc.level?`<div class="abs" data-in="${wt(sc,sc.level_at,.6)}" data-fx="pop" style="left:80px;top:730px">${lvlChip(sc.level)}</div>`:''}
  <div class="abs" data-in="${wt(sc,sc.level_at,.6)+.3}" data-fx="up" style="left:84px;top:820px;color:#9FC3CA;font:500 30px Inter">${esc(sc.source||'')}</div>`+pills(sc,sc.pills,920);},
 list(sc){let h=`<div class="abs head fith" data-in="0" data-fx="up" style="top:395px;font-size:64px;max-height:150px">${esc(sc.headline)}</div>`;
  (sc.items||[]).slice(0,3).forEach((it,i)=>{h+=`<div class="abs row" data-in="${wt(sc,it.at,.8+i*1.4)}" data-fx="up" style="top:${580+i*190}px"><div><div class="n fitw" data-min="30">${esc(it.name)}</div><div class="t fitw" data-min="20">${esc(it.tag||'')}</div></div>${it.level?lvlChip(it.level):''}</div>`;});return h;},
 stock(sc){let h='';if(sc.headline) h+=`<div class="abs head fith" data-in=".2" data-fx="up" style="top:395px;font-size:72px;max-height:250px;text-shadow:0 6px 24px rgba(0,0,0,.5)">${esc(sc.headline)}</div>`;
  if(sc.phone) h+=`<div class="abs" data-in="${wt(sc,sc.phone.at,1)}" data-fx="pop" style="left:290px;top:560px;width:500px;border-radius:40px;background:#F6EFE3;padding:30px 34px;box-sizing:border-box;box-shadow:0 30px 70px rgba(0,0,0,.5)">
   <div style="display:flex;align-items:center;gap:14px;font:700 30px Inter;color:#0F2A3D"><img src="assets/icon.png" style="width:56px;height:56px;border-radius:14px">Travel Safety Watch</div>
   <div style="margin-top:22px;font:700 40px/1.2 Inter;color:#0F2A3D">${esc(sc.phone.title)}</div><div style="margin-top:12px;font:500 30px/1.3 Inter;color:#36546a">${esc(sc.phone.text||'')}</div></div>`;
  return h+pills(sc,sc.pills,1100);},
 founder(sc){const f=SPEC.founder_url, mode=sc.mode||['desk','call','studio'][(SPEC.variant||0)%3];
  const name=esc((SPEC.founder&&SPEC.founder.name)||''), role=esc((SPEC.founder&&SPEC.founder.role)||'Founder, ELEVEX');
  let h=`<div class="abs head fith" data-in="0" data-fx="up" style="top:400px;left:70px;width:940px;font-size:100px;max-height:420px;${sc._clip?'text-shadow:0 8px 30px rgba(0,0,0,.7);':''}">${esc(sc.headline||'').replace(/\*([^*]+)\*/g,'<span style="color:#E2765A">$1</span>')}</div>`;
  if(mode==='photo'){ // library photo is the background clip; tag sits below the photo, captions over the lower part
   h+=`<div class="abs" data-in=".5" data-fx="up" style="left:70px;top:1585px;color:#fff"><div style="font:700 40px Inter;color:#FFD166;letter-spacing:4px;text-shadow:0 3px 12px rgba(0,0,0,.7)">${role.toUpperCase()}</div></div>`; return h;}
  const img=(top,w,left,extra='')=>`<img class="abs" data-in="0" data-fx="rise" src="${f}" style="left:${left}px;top:${top}px;width:${w}px;${extra}">`;
  if(mode==='call'){
   h+=`<div class="abs" style="left:60px;top:820px;width:960px;height:1020px;border-radius:44px;overflow:hidden;background:linear-gradient(160deg,#1b3b52,#0b1d2b);box-shadow:0 30px 80px rgba(0,0,0,.5);border:4px solid rgba(255,255,255,.18)">
     <img src="${f}" style="position:absolute;left:-10px;top:90px;width:980px"></div>
    <div class="abs" style="left:92px;top:850px;display:flex;align-items:center;gap:12px;background:rgba(0,0,0,.45);padding:10px 22px;border-radius:30px;font:700 30px Inter;color:#fff"><i style="width:16px;height:16px;border-radius:8px;background:#35d07f;display:inline-block"></i>LIVE</div>
    <div class="abs" style="left:92px;top:1740px;display:flex;align-items:center;gap:14px;background:rgba(0,0,0,.55);padding:12px 26px;border-radius:30px;font:700 34px Inter;color:#fff">${icon('phone',34,'#fff',2)}${name}</div>`;
  } else if(mode==='desk'){
   h+=img(850,1080,0);
   h+=`<div class="abs" style="left:0;top:1770px;width:1080px;height:150px;background:linear-gradient(180deg,rgba(20,14,10,0) 0%,#1a120c 35%,#0e0906 100%)"></div>
    <div class="abs" style="left:290px;top:1570px;width:500px;height:300px;border-radius:26px 26px 8px 8px;background:linear-gradient(180deg,#3a4049,#1c2026);box-shadow:0 -10px 60px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.18)"><div class="serif" style="position:absolute;left:0;right:0;top:105px;text-align:center;font:600 50px Fraunces;color:#E2765A;letter-spacing:8px;text-shadow:0 0 30px rgba(226,118,90,.7)">ELEVEX</div></div><div class="abs" style="left:230px;top:1862px;width:620px;height:26px;border-radius:0 0 40px 40px;background:linear-gradient(180deg,#2a2f36,#14171b)"></div>`;
  } else {
   h+=`<div class="abs" style="left:140px;top:1000px;width:800px;height:800px;border-radius:400px;background:radial-gradient(circle,rgba(226,118,90,.55) 0%,rgba(226,118,90,0) 70%)"></div>`+img(850,1080,0);
  }
  h+=`<div class="abs" data-in=".5" data-fx="up" style="left:70px;top:585px;color:#fff"><div class="serif" style="font:700 52px Fraunces;text-shadow:0 4px 18px rgba(0,0,0,.6)">${name}</div><div style="font:600 32px Inter;color:#FFD166;letter-spacing:3px;text-shadow:0 3px 12px rgba(0,0,0,.6)">${role.toUpperCase()}</div></div>`;
  return h;},
 app(sc){return `<div class="abs head" data-in="0" data-fx="up" style="top:395px;font-size:64px">All in one free app</div>

   <img class="abs" src="assets/app1.png" style="left:0;top:0;width:568px"><img class="abs" data-in="${wt(sc,'advice',1.6)}" data-fx="fade" src="assets/app2.png" style="left:0;top:0;width:568px"></div>`;},
 outro(sc){const soon=SPEC.cta==='soon';return `<img class="abs" data-in="0" data-fx="pop" src="assets/icon.png" style="left:420px;top:450px;width:240px;height:240px;border-radius:54px;box-shadow:0 24px 60px rgba(0,0,0,.35)">
  <div class="abs" data-in=".15" data-fx="up" style="left:0;width:1080px;top:730px;text-align:center;color:#F6EFE3;font:600 76px Fraunces">Travel Safety Watch</div>
  ${stores(wt(sc,'google',.6),850)}
  <div class="abs" data-in="${soon?wt(sc,'free',1.4):wt(sc,'link',1.4)}" data-fx="up" style="left:0;width:1080px;top:1060px;text-align:center;color:${soon?'#F6EFE3':'#CFE6E9'};font:${soon?'600 44px':'500 36px'} Inter">${soon?'Use it free now: travelsafetywatch.com':'also on the web: travelsafetywatch.com'}</div>
  <div class="abs serif" data-in="${sc.dur-1.6}" data-fx="up" style="left:0;width:1080px;top:1160px;text-align:center;color:#E2765A;font:600 64px Fraunces">Travel informed</div>`;},
 endcard(sc){const soon=SPEC.cta==='soon';return `<img class="abs" data-in="0" data-fx="pop" src="assets/icon.png" style="left:420px;top:520px;width:240px;height:240px;border-radius:54px;box-shadow:0 24px 60px rgba(0,0,0,.35)">

// Fit text to its box in BOTH directions (a long single word used to run off the side because only height was checked).
function fitAll(root){
 root.querySelectorAll('.fith').forEach(el=>{let fs=parseFloat(getComputedStyle(el).fontSize);const mh=parseFloat(el.style.maxHeight)||9999;
  const over=()=>el.scrollHeight>mh||el.scrollWidth>el.clientWidth+1;while(over()&&fs>30){fs-=2;el.style.fontSize=fs+'px';}});
 root.querySelectorAll('.fitw').forEach(el=>{let fs=parseFloat(getComputedStyle(el).fontSize);const min=parseFloat(el.dataset.min)||24;
  while(el.scrollWidth>el.clientWidth+1&&fs>min){fs-=2;el.style.fontSize=fs+'px';}});
 root.querySelectorAll('.pill').forEach(el=>{let fs=parseFloat(getComputedStyle(el).fontSize);while(el.scrollWidth>el.clientWidth+1&&fs>24){fs-=2;el.style.fontSize=fs+'px';}});}

// Safety net: after fitting, list any text that still runs outside the 1080x1920 frame (or is clipped inside its box).
// render.mjs refuses to render a video if this list is not empty, so a cut-off headline can never be posted.
function layoutProblems(root,label){const bad=[];const FR={l:40,r:1040,t:0,b:1920};
 root.querySelectorAll('[data-in]').forEach(n=>{n.style.transform='none';n.style.opacity=1;});
 root.querySelectorAll('*').forEach(el=>{
  if(!([...el.childNodes].some(n=>n.nodeType===3&&n.textContent.trim())))return;
  const r=document.createRange();r.selectNodeContents(el);const b=r.getBoundingClientRect();if(!b.width)return;
  const txt=el.textContent.trim().slice(0,40);
  if(b.left<FR.l-1||b.right>FR.r+1||b.top<FR.t||b.bottom>FR.b)bad.push(`${label}: "${txt}" runs off the frame`);
  else if(el.scrollWidth>el.clientWidth+1&&getComputedStyle(el).display!=='inline')bad.push(`${label}: "${txt}" is wider than its box`);});
 return bad;}

window.setSpec=async spec=>{SPEC=spec;SPEC.total=spec.scenes.reduce((a,sc)=>a+(sc.dur||0),0);SPEC.variant=Number.isFinite(+spec.variant)?+spec.variant%3:(Number(spec.seed)||0)%3;const root=document.getElementById('scenes');
 document.getElementById('tag').textContent=spec.series||'';
 // Brand header + footer link: every video shows who and where, in the site's own colour (spec.brand: "tsw" default | "elevex" | "apps" | false).
 const TH={tsw:{a:'#FF7A59',n:'TRAVEL SAFETY <b>WATCH</b>',url:'travelsafetywatch.com'},elevex:{a:'#2868F8',n:'ELEV<b>EX</b>',url:'elevex.digital'},apps:{a:'#9D7BFF',n:'ELEVEX <b>APPS</b>',url:'elevexapps.elevex.digital'}};
 const BR=spec.brand===false?null:TH[spec.brand||'tsw'];const bh=document.getElementById('brand'),fo=document.getElementById('foot');
 document.getElementById('stage').style.setProperty('--acc',BR?BR.a:'#FF7A59');
 bh.style.display=BR?'block':'none';bh.innerHTML=BR?`<div class="n">${BR.n}</div><div class="u">${esc(BR.url)}</div>`:'';
 fo.innerHTML=BR?`<span>${esc(BR.url)}</span>`:'';
 root.innerHTML=spec.scenes.map((sc,i)=>`<div class="scene" id="sc${i}">${(B[sc.type]||B.point)(sc)}</div>`).join('');
 const cv=document.getElementById('cover');cv.innerHTML=coverHTML(spec);
 await Promise.all(['600 100px Fraunces','700 100px Fraunces','500 30px Inter','600 30px Inter','700 30px Inter'].map(f=>document.fonts.load(f,'Aa0')));await document.fonts.ready; // fonts load lazily: without this, text was measured in a narrower fallback font
 await Promise.all([...document.images].map(im=>im.complete?1:new Promise(r=>{im.onload=im.onerror=r;})));
 window.__layoutProblems=[];
 cv.style.display='block';fitAll(cv);window.__layoutProblems.push(...layoutProblems(cv,'cover'));cv.style.display='none';
 spec.scenes.forEach((sc,i)=>{const el=document.getElementById('sc'+i);el.style.display='block';fitAll(el);window.__layoutProblems.push(...layoutProblems(el,`scene ${i+1} (${sc.type})`));el.style.display='none';});};


// Cover: a still title card used as the thumbnail (YouTube, Instagram) and as the first frames (Facebook, TikTok).
// Key content sits between y=400 and y=1500 so it survives the 4:5 grid crop and the platforms' bottom overlays.
function coverHTML(spec){const first=spec.scenes[0]||{};const c=spec.cover||{};
 const photo=c.bg?`<div class="abs" style="inset:0;background:linear-gradient(180deg,rgba(8,22,34,.55) 0%,rgba(8,22,34,.15) 35%,rgba(8,22,34,.35) 62%,rgba(8,22,34,.88) 100%),url('${c.bg}') center/cover"></div>`:'';
 const title=c.title||spec.cover_title||first.headline||first.name||spec.title||'Travel informed';
 const big=c.big!==undefined?c.big:(first.type==='hook'?first.big:'');const ic=c.icon||(first.type==='hook'||first.type==='point'?first.icon:'')||'compass';
 let h=`<div class="abs" style="left:0;width:1080px;top:420px;text-align:center;font:600 34px Inter;letter-spacing:10px;color:#E2765A">${esc(spec.series||'')}</div>
  <div class="abs" style="left:495px;top:478px;width:90px;height:4px;background:#E2765A;border-radius:2px"></div>`;
 if(photo)h=photo+h;
 h+=big?`<div class="abs serif fitw" data-min="90" style="left:80px;width:860px;top:540px;text-align:center;color:#E2765A;font:700 300px/1 Fraunces">${esc(big)}</div>`
   :`<div class="abs" style="left:0;width:1080px;top:560px;display:flex;justify-content:center">${icon(ic,240,'#F6EFE3',1.6)}</div>`;
 h+=`<div class="abs serif fith" style="left:80px;width:860px;top:${big?880:840}px;text-align:center;color:#F6EFE3;font:600 108px/1.04 Fraunces;max-height:390px">${esc(title)}</div>
  <div class="abs" style="left:0;width:1080px;top:1410px;display:flex;justify-content:center;align-items:center;gap:22px">
   <img src="assets/icon.png" style="width:96px;height:96px;border-radius:24px;box-shadow:0 12px 30px rgba(0,0,0,.35)">
   <div><div style="color:#F6EFE3;font:600 46px Fraunces">Travel Safety Watch</div><div style="color:#E2765A;font:600 28px Inter;letter-spacing:4px;margin-top:4px">TRAVEL INFORMED</div></div></div>`;
 return h;}
window.renderCover=()=>{document.querySelectorAll('.scene').forEach(e=>e.style.display='none');
 document.getElementById('stage').className='solid';document.getElementById('rings').style.display='block';rings(2.5);
 ['tag','tagline','cap'].forEach(id=>document.getElementById(id).style.opacity=0);document.getElementById('cap').innerHTML='';
 const cv=document.getElementById('cover');cv.style.display='block';};
function rings(T){let h='';for(let i=0;i<9;i++){const r=140+i*120+((T*18)%120);const o=.28*(1-(r-140)/1100);h+=`<circle cx="900" cy="1560" r="${r}" fill="none" stroke="#1F7A8C" stroke-width="2" opacity="${Math.max(0,o).toFixed(3)}"/>`;}document.getElementById('rings').innerHTML=h;}
function captions(sc,t){const cap=document.getElementById('cap');const ws=sc.words||[];if(!ws.length||sc.type==='endcard'){cap.innerHTML='';return;}
 const chunks=[];let cur=[];ws.forEach((w,i)=>{cur.push(i);const nx=ws[i+1];if(cur.length>=3||/[.?!:,]$/.test(w[0])||(nx&&cur.reduce((q,j)=>q+ws[j][0].length,0)+nx[0].length>14)){chunks.push(cur);cur=[];}});if(cur.length)chunks.push(cur);
 let a=-1;ws.forEach((w,i)=>{if(t>=w[1])a=i;});if(a<0){cap.innerHTML='';return;}
 const ch=chunks.find(c=>c.includes(a));const age=t-ws[a][1],k=clamp(age/.14);const pop=1+.28*Math.pow(1-k,2); // active word pops in
 cap.innerHTML=ch.map(i=>`<span class="${i===a?'on':(i<a?'':'off')}">${esc(ws[i][0])}</span>`).join(' ');}

window.render=(idx,t,T)=>{const sc=SPEC.scenes[idx];document.querySelectorAll('.scene').forEach(e=>e.style.display='none');document.getElementById('cover').style.display='none';
 const el=document.getElementById('sc'+idx);el.style.display='block';
 const stock=sc.type==='stock'||!!sc._clip;document.getElementById('stage').className=stock?'overlay':'solid';
 const zk=ease(t/.4);document.getElementById('scenes').style.transform=`scale(${(1.07-.07*zk).toFixed(4)})`;document.getElementById('scenes').style.transformOrigin='540px 900px'; // punch-in on every cut
 document.getElementById('cap').style.opacity=1;document.getElementById('cap').style.top=(sc.type==='founder'&&sc.mode!=='photo')?'745px':'1305px'; // founder: captions above the head, never over the face
  // renderCover() hides the captions for the cover card; they must come back for every scene
 document.getElementById('flash').style.opacity=idx>0?Math.max(0,.55*(1-t/.14)):0;
 document.getElementById('prog').style.width=(SPEC.total?Math.min(1,T/SPEC.total)*1080:0)+'px';
 document.getElementById('rings').style.display=stock?'none':'block';if(!stock)rings(T);
 const tagVis=!['app','outro','endcard'].includes(sc.type);const tg=tagVis?1:Math.max(0,1-t/.4);document.getElementById('tag').style.opacity=tg;document.getElementById('tagline').style.opacity=tg;
 el.querySelectorAll('[data-in]').forEach(n=>{const p=ease((t-parseFloat(n.dataset.in))/(n.dataset.fx==='fade'?.6:.45));const fx=n.dataset.fx;n.style.opacity=p;
  n.style.transform=fx==='pop'?`scale(${.85+.15*p})`:fx==='rise'?`translateY(${(1-p)*80}px)`:fx==='fade'?'none':`translateY(${(1-p)*40}px)`;});
 document.getElementById('foot').style.display=(idx===SPEC.scenes.length-1&&SPEC.brand!==false)?'flex':'none';
 captions(sc,t);};
