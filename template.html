<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="node_modules/@fontsource/inter/400.css">
<link rel="stylesheet" href="node_modules/@fontsource/inter/500.css">
<link rel="stylesheet" href="node_modules/@fontsource/inter/600.css">
<link rel="stylesheet" href="node_modules/@fontsource/inter/700.css">
<link rel="stylesheet" href="node_modules/@fontsource/inter/800.css">
<link rel="stylesheet" href="node_modules/@fontsource/fraunces/600.css">
<link rel="stylesheet" href="node_modules/@fontsource/fraunces/700.css">
<style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:transparent}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden}
#stage.solid{background:radial-gradient(1200px 1200px at 50% 38%,#15364d 0%,#0F2A3D 60%,#0b2232 100%)}
#stage.overlay{background:linear-gradient(180deg,rgba(11,29,43,.82) 0%,rgba(11,29,43,.25) 30%,rgba(11,29,43,.15) 55%,rgba(11,29,43,.85) 78%,rgba(11,29,43,.9) 100%)}
.abs{position:absolute}
#tag{left:80px;top:250px;font:600 30px Inter;letter-spacing:8px;color:#E2765A}
#tagline{left:80px;top:300px;width:90px;height:4px;background:#E2765A;border-radius:2px}
.scene{position:absolute;inset:0;display:none}
.serif{font-family:Fraunces,serif}
.badge{left:80px;top:380px;width:120px;height:120px;border-radius:60px;background:#E2765A;color:#0F2A3D;font:700 68px Fraunces;display:flex;align-items:center;justify-content:center}
.head{left:80px;width:860px;color:#F6EFE3;font:600 84px/1.06 Fraunces}
.pill{border-radius:40px;padding:18px 34px;font:600 36px Inter;display:inline-flex;align-items:center;gap:14px;box-sizing:border-box;max-width:920px}
.pill svg{flex:none}
.p-light{background:#F6EFE3;color:#0F2A3D}.p-teal{background:#1F7A8C;color:#F6EFE3}.p-coral{background:#E2765A;color:#0F2A3D}
.note{color:#CFE6E9;font:500 38px Inter;text-align:center}
.lvl{border-radius:30px;padding:12px 26px;font:700 32px Inter;display:inline-flex;align-items:center;gap:12px}
.lvl i{width:16px;height:16px;border-radius:8px;background:currentColor;display:inline-block}
.row{left:90px;width:900px;height:160px;border-radius:28px;background:rgba(246,239,227,.08);border:2px solid rgba(207,230,233,.25);box-sizing:border-box;padding:0 34px;display:flex;align-items:center;justify-content:space-between}
.row .n{color:#F6EFE3;font:600 54px Fraunces}.row .t{color:#CFE6E9;font:500 30px Inter;margin-top:6px}
#cap{left:80px;top:1290px;width:860px;text-align:center;font:700 60px/1.22 Inter;color:#F6EFE3;text-shadow:0 4px 18px rgba(0,0,0,.45)}
#cap .on{color:#E2765A}#cap .off{opacity:.55}
</style></head><body>
<div id="stage" class="solid">
 <svg id="rings" class="abs" width="1080" height="1920" style="left:0;top:0"></svg>
 <div id="tag" class="abs"></div><div id="tagline" class="abs"></div>
 <div id="scenes"></div>
 <div id="cap" class="abs"></div>
</div>
<script>
// ---------- icons (24x24 line icons) ----------
const P={
 taxi:'<path d="M5 11l1.5-4.5A2 2 0 0 1 8.4 5h7.2a2 2 0 0 1 1.9 1.5L19 11"/><rect x="3" y="11" width="18" height="6" rx="2"/><circle cx="7.5" cy="17.5" r="1.5"/><circle cx="16.5" cy="17.5" r="1.5"/><path d="M10 3h4"/>',
 plane:'<path d="M2 16l20-6-2-3-6 2-6-6-2 1 4 7-5 1.5-2-2-2 .5z"/><path d="M3 21h18"/>',
 hotel:'<path d="M4 21V4h16v17"/><path d="M9 21v-4h6v4M8 8h2M14 8h2M8 12h2M14 12h2"/>',
 phone:'<path d="M5 3h4l2 5-3 2a12 12 0 0 0 6 6l2-3 5 2v4a2 2 0 0 1-2 2A18 18 0 0 1 3 5a2 2 0 0 1 2-2z"/>',
 passport:'<rect x="4" y="2.5" width="16" height="19" rx="2"/><circle cx="12" cy="10" r="3.5"/><path d="M8 17h8"/>',
 shield:'<path d="M12 2.5l8 3v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10v-6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/>',
 map:'<path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/>',
 pin:'<path d="M12 22s7-6.5 7-12a7 7 0 0 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/>',
 check:'<path d="M5 12l5 5L20 7"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/>',
 train:'<rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 11h14M9 21l-2-4M15 21l2-4"/><circle cx="9" cy="14" r="1"/><circle cx="15" cy="14" r="1"/>',
 storm:'<path d="M7 16a5 5 0 1 1 1-9.9A6 6 0 0 1 19 9a4 4 0 0 1-1 7.9"/><path d="M13 12l-3 5h4l-3 5"/>',
 sun:'<circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
 wave:'<path d="M2 15c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2M2 20c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2"/><path d="M8 9c0-3 3-5 6-5 2 0 3.5 1 4 2-2 0-3 1-3 3"/>',
 fire:'<path d="M12 22c4 0 7-3 7-7 0-4-3-6-4-10-2 2-3 4-3 6-1-1-2-2-2-4-2 2-5 5-5 8 0 4 3 7 7 7z"/>',
 alert:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/>',
 money:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M6 9v.01M18 15v.01"/>',
 bag:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
 nowifi:'<path d="M2 8.5a15 15 0 0 1 20 0M5.5 12.5a10 10 0 0 1 13 0M9 16.3a5 5 0 0 1 6 0"/><path d="M3 3l18 18"/>',
 pharmacy:'<path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z"/>',
 globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
 people:'<circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6M15 14.5c3 0 6 2 6 5"/>',
 lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
 camera:'<rect x="3" y="7" width="18" height="13" rx="2"/><circle cx="12" cy="13.5" r="3.5"/><path d="M8 7l1.5-3h5L16 7"/>',
 card:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/>',
 food:'<path d="M7 3v8a2 2 0 0 0 2 2v8M11 3v8M7 7h4M17 3c-2 2-2 6 0 8v10"/>',
 water:'<path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z"/>',
 health:'<path d="M12 21s-8-5-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 6-8 11-8 11z"/><path d="M9 11h6M12 8v6"/>',
 info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5h.01"/>',
 bus:'<rect x="4" y="3" width="16" height="15" rx="3"/><path d="M4 11h16M8 21v-3M16 21v-3"/><circle cx="8" cy="14.5" r="1"/><circle cx="16" cy="14.5" r="1"/>',
 compass:'<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>',
};
const icon=(name,size,color,sw=1.9)=>`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${P[name]||P.info}</svg>`;
const LEVELS={avoid:['Avoid Travel','#E05A47','#2a0f0b'],reconsider:['Reconsider Travel','#E2765A','#2a120b'],take_care:['Take Care','#F0A04B','#2a1a06'],be_aware:['Be Aware','#E9C46A','#2a2206'],clear:['Clear','#2A9D8F','#06201d']};
const lvlChip=k=>{const L=LEVELS[k]||LEVELS.be_aware;return `<span class="lvl" style="background:${L[1]};color:${L[2]}"><i></i>${L[0]}</span>`;};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------- timing helpers ----------
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>1-Math.pow(1-clamp(x),3);
let SPEC=null;
const norm=s=>String(s).replace(/[^\w']/g,'').toLowerCase();
function wt(sc,word,fallback){if(!word)return fallback;const w=sc.words.find(x=>norm(x[0])===norm(word));return w?Math.max(0,w[1]-.1):fallback;}

// ---------- scene builders: each returns html; animated nodes carry data-in / data-fx ----------
function pills(sc,list,top){let h='',y=top;(list||[]).forEach((p,i)=>{const at=wt(sc,p.at,1.2+i*1.1);
  if(p.style==='note'){h+=`<div class="abs note" data-in="${at}" data-fx="up" style="left:60px;width:960px;top:${y}px">${esc(p.text)}</div>`;y+=90;}
  else{const cls=p.style==='teal'?'p-teal':p.style==='coral'?'p-coral':'p-light';const ic=p.icon?icon(p.icon,40,cls==='p-teal'?'#F6EFE3':cls==='p-coral'?'#0F2A3D':'#1F7A8C',2.2):'';
   h+=`<div class="abs" style="left:0;width:1080px;top:${y}px;display:flex;justify-content:center"><div class="pill ${cls}" data-in="${at}" data-fx="pop">${ic}<span class="fit">${esc(p.text)}</span></div></div>`;y+=120;}});return h;}
// Store row: Google Play + App Store. SPEC.cta: soon = neither live, play = Google Play live; SPEC.ios = App Store live too.
const PLAY_SVG='<svg width="40" height="40" viewBox="0 0 24 24"><path d="M5 3.5v17l14-8.5z" fill="#1F7A8C"/></svg>';
const STORE_SVG='<svg width="40" height="40" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5" fill="#1F7A8C"/><path d="M9.6 6.5 15.8 17M14.4 6.5 8.2 17M6.5 14h11" stroke="#fff" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>';
function stores(at,top){const soon=SPEC.cta==='soon',ios=!!SPEC.ios;
 const label=soon?'Coming soon to':(ios?'Free on':'Free on Google Play · App Store coming soon');
 const pill=(svg,t,dim)=>`<div class="pill p-light" data-in="${at}" data-fx="pop" style="font-size:40px${dim?';opacity:.7':''}">${svg}${t}</div>`;
 return `<div class="abs" data-in="${at}" data-fx="up" style="left:0;width:1080px;top:${top}px;text-align:center;color:#CFE6E9;font:600 38px Inter">${label}</div>
  <div class="abs" style="left:0;width:1080px;top:${top+64}px;display:flex;justify-content:center;gap:28px">${pill(PLAY_SVG,'Google Play')}${pill(STORE_SVG,'App Store',!soon&&!ios)}</div>`;}
const B={
 hook(sc){let h='';
  if(sc.big) h+=`<div class="abs serif" data-in="0" data-fx="pop" style="left:80px;top:420px;color:#E2765A;font:700 400px/1 Fraunces">${esc(sc.big)}</div>`;
  else if(sc.icon) h+=`<div class="abs" data-in="0" data-fx="pop" style="left:80px;top:470px">${icon(sc.icon,320,'#F6EFE3',1.6)}</div>`;
  h+=`<div class="abs head fith" data-in=".25" data-fx="up" style="top:860px;font-size:96px;max-height:250px">${esc(sc.headline)}</div>`;
  if(sc.pill) h+=`<div class="abs pill p-teal" data-in="${wt(sc,sc.pill.at,1.6)}" data-fx="up" style="left:80px;top:1140px">${sc.pill.icon?icon(sc.pill.icon,40,'#F6EFE3',2.2):''}${esc(sc.pill.text)}</div>`;
  return h;},
 point(sc){let h='';const hasN=sc.n!=null&&sc.n!=='';
  if(hasN) h+=`<div class="abs badge" data-in="0" data-fx="pop">${esc(sc.n)}</div>`;
  h+=`<div class="abs head fith" data-in="0" data-fx="up" style="top:395px;${hasN?'left:230px;width:720px;':''}font-size:64px;max-height:150px">${esc(sc.headline)}</div>`;
  if(sc.icon) h+=`<div class="abs" data-in=".15" data-fx="pop" style="left:390px;top:590px">${icon(sc.icon,300,'#CFE6E9',1.5)}</div>`;
  return h+pills(sc,sc.pills,sc.icon?950:620);},
 number(sc){return `<div class="abs" data-in="0" data-fx="up" style="left:0;width:1080px;top:470px;text-align:center;color:#CFE6E9;font:600 40px Inter;letter-spacing:5px">${esc(sc.label||'')}</div>
  <div class="abs serif" data-in="${wt(sc,sc.at,.2)}" data-fx="pop" style="left:0;width:1080px;top:540px;text-align:center;color:#E2765A;font:700 260px/1 Fraunces">${esc(sc.value)}</div>`+pills(sc,sc.pills,880);},
 place(sc){return `<div class="abs serif fith" data-in="0" data-fx="up" style="left:80px;width:920px;top:470px;color:#F6EFE3;font:600 120px/1.05 Fraunces;max-height:260px">${esc(sc.name)}</div>
  <div class="abs" data-in=".2" data-fx="up" style="left:84px;top:${sc.country?650:600}px;color:#CFE6E9;font:500 40px Inter">${esc(sc.country||'')}</div>
  ${sc.level?`<div class="abs" data-in="${wt(sc,sc.level_at,.6)}" data-fx="pop" style="left:80px;top:730px">${lvlChip(sc.level)}</div>`:''}
  <div class="abs" data-in="${wt(sc,sc.level_at,.6)+.3}" data-fx="up" style="left:84px;top:820px;color:#9FC3CA;font:500 30px Inter">${esc(sc.source||'')}</div>`+pills(sc,sc.pills,920);},
 list(sc){let h=`<div class="abs head fith" data-in="0" data-fx="up" style="top:395px;font-size:64px;max-height:150px">${esc(sc.headline)}</div>`;
  (sc.items||[]).slice(0,3).forEach((it,i)=>{h+=`<div class="abs row" data-in="${wt(sc,it.at,.8+i*1.4)}" data-fx="up" style="top:${580+i*190}px"><div><div class="n">${esc(it.name)}</div><div class="t">${esc(it.tag||'')}</div></div>${it.level?lvlChip(it.level):''}</div>`;});return h;},
 stock(sc){let h='';if(sc.headline) h+=`<div class="abs head fith" data-in=".2" data-fx="up" style="top:395px;font-size:72px;max-height:250px;text-shadow:0 6px 24px rgba(0,0,0,.5)">${esc(sc.headline)}</div>`;
  if(sc.phone) h+=`<div class="abs" data-in="${wt(sc,sc.phone.at,1)}" data-fx="pop" style="left:290px;top:560px;width:500px;border-radius:40px;background:#F6EFE3;padding:30px 34px;box-sizing:border-box;box-shadow:0 30px 70px rgba(0,0,0,.5)">
   <div style="display:flex;align-items:center;gap:14px;font:700 30px Inter;color:#0F2A3D"><img src="assets/icon.png" style="width:56px;height:56px;border-radius:14px">Travel Safety Watch</div>
   <div style="margin-top:22px;font:700 40px/1.2 Inter;color:#0F2A3D">${esc(sc.phone.title)}</div><div style="margin-top:12px;font:500 30px/1.3 Inter;color:#36546a">${esc(sc.phone.text||'')}</div></div>`;
  return h+pills(sc,sc.pills,1100);},
 app(sc){return `<div class="abs head" data-in="0" data-fx="up" style="top:395px;font-size:64px">All in one free app</div>
  <div class="abs pill p-light" data-in="${wt(sc,'advice',1.6)}" data-fx="pop" style="left:80px;top:500px;font-size:32px">Official advice</div>
  <div class="abs pill p-teal" data-in="${wt(sc,'weather',2.2)}" data-fx="pop" style="left:400px;top:500px;font-size:32px">Weather</div>
  <div class="abs pill p-coral" data-in="${wt(sc,'local',2.8)}" data-fx="pop" style="left:628px;top:500px;font-size:32px">Local news</div>
  <div class="abs" data-in=".1" data-fx="rise" style="left:250px;top:600px;width:580px;height:660px;border:6px solid #CFE6E9;border-radius:56px;overflow:hidden;background:#fff;box-shadow:0 30px 70px rgba(0,0,0,.35)">
   <img class="abs" src="assets/app1.png" style="left:0;top:0;width:568px"><img class="abs" data-in="${wt(sc,'advice',1.6)}" data-fx="fade" src="assets/app2.png" style="left:0;top:0;width:568px"></div>`;},
 outro(sc){const soon=SPEC.cta==='soon';return `<img class="abs" data-in="0" data-fx="pop" src="assets/icon.png" style="left:420px;top:450px;width:240px;height:240px;border-radius:54px;box-shadow:0 24px 60px rgba(0,0,0,.35)">
  <div class="abs" data-in=".15" data-fx="up" style="left:0;width:1080px;top:730px;text-align:center;color:#F6EFE3;font:600 76px Fraunces">Travel Safety Watch</div>
  ${stores(wt(sc,'google',.6),850)}
  <div class="abs" data-in="${soon?wt(sc,'free',1.4):wt(sc,'link',1.4)}" data-fx="up" style="left:0;width:1080px;top:1060px;text-align:center;color:${soon?'#F6EFE3':'#CFE6E9'};font:${soon?'600 44px':'500 36px'} Inter">${soon?'Use it free now: travelsafetywatch.com':'also on the web: travelsafetywatch.com'}</div>
  <div class="abs serif" data-in="${sc.dur-1.6}" data-fx="up" style="left:0;width:1080px;top:1160px;text-align:center;color:#E2765A;font:600 64px Fraunces">Travel informed</div>`;},
 endcard(sc){const soon=SPEC.cta==='soon';return `<img class="abs" data-in="0" data-fx="pop" src="assets/icon.png" style="left:420px;top:520px;width:240px;height:240px;border-radius:54px;box-shadow:0 24px 60px rgba(0,0,0,.35)">
  <div class="abs" data-in=".15" data-fx="up" style="left:0;width:1080px;top:800px;text-align:center;color:#F6EFE3;font:600 76px Fraunces">Travel Safety Watch</div>
  ${stores('.35',920)}
  ${soon?'<div class="abs" data-in=".6" data-fx="up" style="left:0;width:1080px;top:1130px;text-align:center;color:#CFE6E9;font:500 38px Inter">Use it free now: travelsafetywatch.com</div>':''}`;},
};

function fitAll(root){root.querySelectorAll('.fith').forEach(el=>{let fs=parseFloat(getComputedStyle(el).fontSize);const mh=parseFloat(el.style.maxHeight)||9999;while(el.scrollHeight>mh&&fs>34){fs-=4;el.style.fontSize=fs+'px';}});
 root.querySelectorAll('.pill').forEach(el=>{let fs=parseFloat(getComputedStyle(el).fontSize);while(el.scrollWidth>el.clientWidth+1&&fs>24){fs-=2;el.style.fontSize=fs+'px';}});}

window.setSpec=async spec=>{SPEC=spec;const root=document.getElementById('scenes');
 document.getElementById('tag').textContent=spec.series||'';
 root.innerHTML=spec.scenes.map((sc,i)=>`<div class="scene" id="sc${i}">${(B[sc.type]||B.point)(sc)}</div>`).join('');
 await document.fonts.ready;spec.scenes.forEach((sc,i)=>{const el=document.getElementById('sc'+i);el.style.display='block';fitAll(el);el.style.display='none';});
 await Promise.all([...document.images].map(im=>im.complete?1:new Promise(r=>{im.onload=im.onerror=r;})));};

function rings(T){let h='';for(let i=0;i<9;i++){const r=140+i*120+((T*18)%120);const o=.28*(1-(r-140)/1100);h+=`<circle cx="900" cy="1560" r="${r}" fill="none" stroke="#1F7A8C" stroke-width="2" opacity="${Math.max(0,o).toFixed(3)}"/>`;}document.getElementById('rings').innerHTML=h;}
function captions(sc,t){const cap=document.getElementById('cap');const ws=sc.words||[];if(!ws.length||sc.type==='endcard'){cap.innerHTML='';return;}
 const chunks=[];let cur=[];ws.forEach((w,i)=>{cur.push(i);if(cur.length>=5||/[.?!:]$/.test(w[0])){chunks.push(cur);cur=[];}});if(cur.length)chunks.push(cur);
 let a=-1;ws.forEach((w,i)=>{if(t>=w[1])a=i;});if(a<0){cap.innerHTML='';return;}
 const ch=chunks.find(c=>c.includes(a));cap.innerHTML=ch.map(i=>`<span class="${i===a?'on':(i<a?'':'off')}">${esc(ws[i][0])}</span>`).join(' ');}

window.render=(idx,t,T)=>{const sc=SPEC.scenes[idx];document.querySelectorAll('.scene').forEach(e=>e.style.display='none');
 const el=document.getElementById('sc'+idx);el.style.display='block';
 const stock=sc.type==='stock';document.getElementById('stage').className=stock?'overlay':'solid';
 document.getElementById('rings').style.display=stock?'none':'block';if(!stock)rings(T);
 const tagVis=!['app','outro','endcard'].includes(sc.type);const tg=tagVis?1:Math.max(0,1-t/.4);document.getElementById('tag').style.opacity=tg;document.getElementById('tagline').style.opacity=tg;
 el.querySelectorAll('[data-in]').forEach(n=>{const p=ease((t-parseFloat(n.dataset.in))/(n.dataset.fx==='fade'?.6:.45));const fx=n.dataset.fx;n.style.opacity=p;
  n.style.transform=fx==='pop'?`scale(${.85+.15*p})`:fx==='rise'?`translateY(${(1-p)*80}px)`:fx==='fade'?'none':`translateY(${(1-p)*40}px)`;});
 captions(sc,t);};
</script></body></html>
