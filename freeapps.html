<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="node_modules/@fontsource/inter/400.css">
<link rel="stylesheet" href="node_modules/@fontsource/inter/600.css">
<link rel="stylesheet" href="node_modules/@fontsource/inter/700.css">
<link rel="stylesheet" href="node_modules/@fontsource/inter/800.css">
<link rel="stylesheet" href="node_modules/@fontsource/inter/900.css">
<style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:transparent}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Inter,sans-serif}
.abs{position:absolute}
#bg{inset:0}
.head{left:70px;width:940px;top:64px;text-align:center;color:#fff;font:800 86px/1.04 Inter;letter-spacing:-2px;text-shadow:0 6px 28px rgba(0,0,0,.45)}
.fa{white-space:nowrap;box-sizing:border-box;padding:0 70px}
.fa2{white-space:nowrap}
.head em{font-style:normal;color:var(--accent)}
.pillTop{left:0;width:1080px;top:246px;display:flex;justify-content:center}
.pillTop span{font:700 30px Inter;color:#fff;border:3px solid rgba(255,255,255,.85);border-radius:40px;padding:6px 26px;background:rgba(0,0,0,.28)}
/* phone: screen hole is exactly 680x1470 at (200,330) */
.bezel{left:182px;top:312px;width:716px;height:1506px;box-sizing:border-box;border:18px solid #0a0a0f;border-radius:86px;box-shadow:0 0 0 3px rgba(255,255,255,.14),0 40px 90px rgba(0,0,0,.55)}
.notch{left:420px;top:362px;width:240px;height:34px;border-radius:20px;background:#0a0a0f}
.sticker{left:24px;top:1650px;transform:rotate(-6deg) scale(.62);transform-origin:left top;text-align:center}
.sticker .a{background:#ff3b6b;color:#fff;font:900 96px/1 Inter;padding:18px 54px 40px;border-radius:30px;box-shadow:0 14px 30px rgba(0,0,0,.4);letter-spacing:2px}
.sticker .b{background:#fff;color:#111;font:800 44px/1 Inter;padding:16px 40px;border-radius:30px;margin:-34px 18px 0;position:relative;box-shadow:0 8px 18px rgba(0,0,0,.3)}
.hkbg{inset:0}
.hkwrap{left:60px;width:960px;top:300px;height:1000px;display:flex;align-items:center;justify-content:center}
.hkhead{width:960px;text-align:center;color:#fff;font:900 148px/1.0 Inter;letter-spacing:-5px;text-shadow:0 10px 0 rgba(0,0,0,.28),0 14px 40px rgba(0,0,0,.45)}
.hkhead em{font-style:normal;color:#FFE14D}
.hkbadge{left:0;width:1080px;top:1380px;display:flex;justify-content:center;gap:22px}
.hkbadge span{background:#fff;color:#111;font:900 50px/1 Inter;padding:24px 44px;border-radius:60px;box-shadow:0 12px 0 rgba(0,0,0,.25)}
.hkbadge span.b{background:#111;color:#fff}
.hkapp{left:0;width:1080px;top:1560px;display:flex;justify-content:center;align-items:center;gap:22px;color:#fff;font:800 56px Inter;text-shadow:0 4px 20px rgba(0,0,0,.5)}
.hkapp img{width:120px;height:120px;border-radius:30px;object-fit:cover;box-shadow:0 10px 30px rgba(0,0,0,.45)}
/* cover / styled hook card (spec.cover, spec.hook.style): key text stays inside the 3:4 grid crop (y 240-1680) */
.cvbg{inset:0;overflow:hidden}
.cvbg img{position:absolute;inset:-60px;width:1200px;height:2040px;object-fit:cover}
.cvk{left:0;width:1080px;display:flex;justify-content:center}
.cvk span{font:900 52px/1 Inter;letter-spacing:1px;padding:18px 36px;border-radius:18px;background:#111;color:#fff;box-shadow:0 10px 0 rgba(0,0,0,.25)}
.cvbox{left:50px;width:980px;top:300px;height:1150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.cvbox .ln{display:inline-block;max-width:940px;box-sizing:border-box;text-align:center;background:#fff;color:#111;font:900 112px/1.02 Inter;letter-spacing:-3px;padding:14px 30px 20px;border-radius:22px;box-shadow:0 14px 0 rgba(0,0,0,.28)}
.cvbox .ln:nth-child(odd){transform:rotate(-2.2deg)} .cvbox .ln:nth-child(even){transform:rotate(1.6deg)}
.cvbox em,.cvph em,.cvst em{font-style:normal;background:#FFE14D;color:#111;border-radius:12px;padding:0 12px}
.cvchip{left:0;width:1080px;top:1500px;display:flex;justify-content:center;align-items:center;gap:20px;color:#fff;font:800 50px Inter;text-shadow:0 4px 18px rgba(0,0,0,.6)}
.cvchip img{width:100px;height:100px;border-radius:26px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.cvchip b{background:#ff3b6b;color:#fff;font:900 38px/1 Inter;padding:14px 22px;border-radius:16px;text-shadow:none}
.cvph{left:70px;width:940px;top:330px;height:520px;display:flex;flex-direction:column;justify-content:center;color:#fff;font:900 128px/1.0 Inter;letter-spacing:-4px;text-shadow:0 8px 30px rgba(0,0,0,.35)}
.cvphone{left:250px;top:1030px;width:600px;height:1300px;border:16px solid #0a0a0f;border-radius:80px;overflow:hidden;transform:rotate(-7deg);box-shadow:0 40px 90px rgba(0,0,0,.55)}
.cvphone img{width:100%;height:100%;object-fit:cover;object-position:top}
.cvst{left:60px;width:960px;top:420px;height:900px;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;font:900 156px/0.98 Inter;letter-spacing:-6px;text-shadow:0 10px 0 rgba(0,0,0,.3),0 14px 40px rgba(0,0,0,.5)}
.cvstamp{left:560px;top:300px;transform:rotate(9deg);font:900 58px/1 Inter;color:#fff;background:var(--accent);border:6px solid #fff;border-radius:20px;padding:18px 30px;box-shadow:0 12px 30px rgba(0,0,0,.4);white-space:nowrap}
/* end card */
.icon{left:420px;top:380px;width:240px;height:240px;border-radius:56px;box-shadow:0 20px 50px rgba(0,0,0,.45);object-fit:cover}
.iconfb{left:420px;top:380px;width:240px;height:240px;border-radius:56px;background:var(--accent);box-shadow:0 20px 50px rgba(0,0,0,.45)}
.ename{left:0;width:1080px;top:660px;text-align:center;color:#fff;font:800 92px/1 Inter;letter-spacing:-2px}
.eline{left:0;width:1080px;top:786px;text-align:center;color:var(--accent);font:800 64px/1 Inter}
.eurl{left:0;width:1080px;top:900px;display:flex;justify-content:center}
.eurl span{background:#fff;color:#0b0b12;font:800 56px/1 Inter;padding:26px 52px;border-radius:70px}
.efree{left:0;width:1080px;top:1048px;text-align:center;color:#fff;font:700 50px/1 Inter}
.badges{left:0;width:1080px;top:1150px;display:flex;justify-content:center;gap:28px}
.badge{border:3px solid rgba(255,255,255,.7);border-radius:22px;background:#000;color:#fff;padding:18px 38px;text-align:center;font:800 44px/1.05 Inter}
.badge small{display:block;font:700 26px Inter;color:#f5b041;letter-spacing:1px;margin-top:4px}
.enote{left:0;width:1080px;top:1340px;text-align:center;color:rgba(255,255,255,.9);font:600 40px/1 Inter}
</style></head><body>
<div id="stage"><div id="root"></div></div>
<script>
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const hl=s=>esc(s).replace(/\*(.+?)\*/g,'<em>$1</em>');
// layer: 'bg' | 'front' | 'end-bg' | 'end'
window.draw=(layer,d)=>{
  const st=document.getElementById('stage'), root=document.getElementById('root');
  st.style.setProperty('--accent',d.accent||'#F5A623');
  const base=d.bg||'#0b1424', acc=d.accent||'#F5A623';
  document.body.style.background='transparent';
  if(layer==='bg'||layer==='end-bg'){
    const cy=layer==='bg'?'58%':'44%';
    root.innerHTML=`<div id="bg" class="abs" style="background:radial-gradient(900px 900px at 50% ${cy},${acc}33 0%,transparent 70%),radial-gradient(1400px 1400px at 50% 40%,${base} 0%,#05070d 100%)"></div>`;
    document.body.style.background=base;
  } else if(layer==='front'){
    root.innerHTML=`<div class="abs head" id="fhead">${hl(d.headline)}</div>`+
      (d.pill?`<div class="abs pillTop"><span>${esc(d.pill)}</span></div>`:'')+
      `<div class="abs bezel"></div>`+
      (d.sticker?`<div class="abs sticker"><div class="a">FREE</div><div class="b">NO SIGN-UP</div></div>`:'');
  } else if(layer==='hook'){
    const bgimg=d.bg?`linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,.05) 40%,rgba(0,0,0,.55)),url('${d.bg}') center/cover`:'';
    const g=bgimg||`radial-gradient(900px 900px at 80% 15%,#ff3b8d 0%,transparent 60%),radial-gradient(1000px 1000px at 10% 90%,${acc} 0%,transparent 65%),linear-gradient(160deg,#6a2cff,#ff3b8d)`;
    root.innerHTML=`<div class="abs hkbg" style="background:${g}"></div><div class="abs hkwrap"><div class="hkhead" id="hkhead">${hl(d.headline)}</div></div>`+
      `<div class="abs hkbadge"><span>FREE</span><span class="b">NO SIGN-UP</span></div>`+
      (d.app?`<div class="abs hkapp">${d.icon?`<img src="${d.icon}">`:''}<span>${esc(d.app)}</span></div>`:'');
  } else if(layer==='cover'){
    const sty=d.style||'boxes', shot=d.shot?`<img src="${d.shot}" style="${sty==='boxes'?'filter:blur(14px) brightness(.5) saturate(1.3)':'filter:blur(22px) brightness(.35) saturate(1.4)'}">`:'';
    const chip=`<div class="abs cvchip">${d.icon?`<img src="${d.icon}">`:''}<span>${esc(d.app||'')}</span><b>FREE</b></div>`;
    if(sty==='phone'){
      root.innerHTML=`<div class="abs cvbg" style="background:linear-gradient(155deg,${acc} 0%,${base} 78%)"></div>`+
        (d.kicker?`<div class="abs cvk" style="top:250px"><span>${esc(d.kicker)}</span></div>`:'')+
        `<div class="abs cvph" id="cvhead">${hl(d.headline).split('|').join('<br>')}</div>`+
        (d.shot?`<div class="abs cvphone"><img src="${d.shot}"></div>`:'')+
        `<div class="abs cvchip" style="top:880px">${d.icon?`<img src="${d.icon}">`:''}<span>${esc(d.app||'')}</span><b>FREE</b></div>`;
    } else if(sty==='stamp'){
      root.innerHTML=`<div class="abs cvbg" style="background:radial-gradient(900px 900px at 50% 45%,${acc}66 0%,transparent 70%),${base}">${shot}</div>`+
        `<div class="abs cvbg" style="background:radial-gradient(800px 800px at 50% 42%,${acc}88 0%,transparent 70%),linear-gradient(180deg,${base}99,${base}ee)"></div>`+
        `<div class="abs cvst" id="cvhead"><div>${hl(d.headline).split('|').join('<br>')}</div></div>`+
        (d.kicker?`<div class="abs cvstamp">${esc(d.kicker)}</div>`:'')+chip;
    } else {
      root.innerHTML=`<div class="abs cvbg" style="background:${base}">${shot}</div><div class="abs cvbg" style="background:linear-gradient(165deg,${acc}cc 0%,${base}99 50%,#ff3b8dbb 100%)"></div>`+
        (d.kicker?`<div class="abs cvk" style="top:300px"><span>${esc(d.kicker)}</span></div>`:'')+
        `<div class="abs cvbox" id="cvhead" style="top:${d.kicker?400:300}px;height:${d.kicker?1060:1150}px">${d.headline.split('|').map(l=>`<div class="ln">${hl(l.trim())}</div>`).join('')}</div>`+chip;
    }
  } else if(layer==='end'){
    const e=d.end||{};
    const soon=e.badges!=='live';
    root.innerHTML=
      (e.icon?`<img class="abs icon" src="${e.icon}">`:`<div class="abs iconfb"></div>`)+
      `<div class="abs ename fa">${esc(e.name)}</div><div class="abs eline fa">${esc(e.line||'Play free now')}</div>`+
      `<div class="abs eurl"><span class="fa2">${esc(e.url)}</span></div><div class="abs efree fa">Free · No sign-up</div>`+
      `<div class="abs badges"><div class="badge">Google Play<small>${soon?'COMING SOON':'GET IT NOW'}</small></div><div class="badge">App Store<small>${soon?'COMING SOON':'GET IT NOW'}</small></div></div>`+
      `<div class="abs enote fa">${esc(e.note||'Use it free on the web today')}</div>`;
  }
  fit(root);
};
// Fit text to its box in both directions; then list anything still outside the 1080x1920 frame.
// freeapps.mjs refuses to render a card with a non-empty list, so cut-off copy can never be posted.
function fit(root){
  const head=root.querySelector('#fhead');
  if(head){let fs=parseFloat(getComputedStyle(head).fontSize);const over=()=>head.scrollHeight>184||head.scrollWidth>head.clientWidth+1;while(over()&&fs>40){fs-=2;head.style.fontSize=fs+'px';}}
  const hk=root.querySelector('#hkhead');
  if(hk){let fs=parseFloat(getComputedStyle(hk).fontSize);const over=()=>hk.scrollHeight>940||hk.scrollWidth>hk.clientWidth+1;while(over()&&fs>56){fs-=4;hk.style.fontSize=fs+'px';}}
  const cv=root.querySelector('#cvhead');
  if(cv){const lim=cv.clientHeight-10;const lns=[...cv.querySelectorAll('.ln')];const els=lns.length?lns:[cv];let fs=parseFloat(getComputedStyle(els[0]).fontSize);
    const over=()=>cv.scrollHeight>lim+12||els.some(e=>e.scrollWidth>e.clientWidth+1)||[...cv.querySelectorAll('*')].concat([cv]).some(e=>{const r=e.getBoundingClientRect();return r.width&&(r.left<45||r.right>1035);});
    while(over()&&fs>48){fs-=4;els.forEach(e=>e.style.fontSize=fs+'px');}}
  const tw=el=>{const r=document.createRange();r.selectNodeContents(el);return r.getBoundingClientRect().width;};
  root.querySelectorAll('.fa').forEach(el=>{let fs=parseFloat(getComputedStyle(el).fontSize);while(tw(el)>940&&fs>20){fs-=2;el.style.fontSize=fs+'px';}});
  root.querySelectorAll('.fa2').forEach(el=>{let fs=parseFloat(getComputedStyle(el).fontSize);while(el.getBoundingClientRect().width>940&&fs>20){fs-=2;el.style.fontSize=fs+'px';}});
  const bad=[];
  root.querySelectorAll('*').forEach(el=>{
    if(![...el.childNodes].some(n=>n.nodeType===3&&n.textContent.trim()))return;
    const r=document.createRange();r.selectNodeContents(el);const b=r.getBoundingClientRect();if(!b.width)return;
    const t=el.textContent.trim().slice(0,40);
    if(el.closest('.sticker')||el.closest('.cvstamp')||el.closest('.cvbox'))return; // fixed words, rotated on purpose
    if(b.left<39||b.right>1041||b.top<0||b.bottom>1920)bad.push(`"${t}" runs off the frame`);
    else if(el.id==='fhead'&&el.scrollHeight>186)bad.push(`headline "${t}" is too tall`);
    else if(!el.classList.contains('fa')&&el.scrollWidth>el.clientWidth+1&&getComputedStyle(el).display!=='inline')bad.push(`"${t}" is wider than its box`);});
  window.__problems=bad;
}
</script></body></html>
